name: Plugin Security Scan

# HOL AI Plugin Scanner — the same pinned action and thresholds the
# awesome-ai-plugins catalog applies, so the source-side score is reproducible.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: HOL AI Plugin Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        uses: hashgraph-online/ai-plugin-scanner-action@588d157fed6e47942a2ca3c9251ff7bff4a48bc9 # v1.2.667
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
