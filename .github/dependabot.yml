version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and its
  # version comment together. PRs target develop — main moves only by release PR.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /pfm
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      go-modules:
        patterns:
          - "*"
